name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r plugins/editable-ppt-workflow/skills/word-to-editable-ppt/requirements-dev.txt
      - name: Run workflow tests
        shell: pwsh
        run: |
          python -m pytest plugins/editable-ppt-workflow/skills/word-to-editable-ppt/tests -q
          python -m pytest plugins/editable-ppt-workflow/skills/codex-gpt-image/tests -q
          python -m pytest plugins/editable-ppt-workflow/skills/image-to-editable-ppt/cli/tests -q
          if (Test-Path tests) { python -m pytest tests -q }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Validate public snapshot
        shell: pwsh
        run: |
          $package = Get-Content -Raw package-info.json | ConvertFrom-Json
          if ($package.repositoryVisibility -eq "public") {
            python scripts/check_public_release.py . --write-report public-release-audit.json
          } else {
            $export = Join-Path $env:RUNNER_TEMP "editable-ppt-public"
            .\scripts\export_public_release.ps1 -OutputPath $export
            python (Join-Path $export "scripts\check_public_release.py") $export --write-report (Join-Path $export "public-release-audit.json")
          }
      - name: Portable clean-install smoke
        shell: pwsh
        run: |
          $tempRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("editable-ppt-ci-" + [guid]::NewGuid().ToString("N"))
          try {
            .\plugins\editable-ppt-workflow\scripts\install_runtime.ps1 -RuntimeRoot (Join-Path $tempRoot "runtime") -BinDir (Join-Path $tempRoot "bin") -PortableSmokeTest
            .\verify.ps1 -RuntimeRoot (Join-Path $tempRoot "runtime") -PortableSmokeTest
          } finally {
            if (Test-Path -LiteralPath $tempRoot) { [System.IO.Directory]::Delete($tempRoot, $true) }
          }
