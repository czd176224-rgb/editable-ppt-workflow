name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r plugins/editable-ppt-workflow/skills/run-word-to-ppt-workflow/requirements-dev.txt
      - name: Complete release gate including Portable clean-install smoke
        shell: pwsh
        run: .\scripts\release_gate.ps1
